# =============================================================================
#  fuzzel — Wayland-лаунчер и dmenu-замена
# -----------------------------------------------------------------------------
#  Документация:  man 5 fuzzel.ini
#  Проверка:      fuzzel --check-config
#  Подключение:   stow -t "$HOME" fuzzel
# =============================================================================

[main]
# Шрифт в формате fontconfig
font=JetBrainsMono Nerd Font:size=16

# Терминал для приложений, которым он нужен
terminal=foot -e

# Строка приглашения и подсказка в пустом поле ввода
prompt="❯ "
placeholder=Поиск приложений…

# Иконки приложений
icons-enabled=yes
icon-theme=Papirus-Dark

# Геометрия и поведение окна
lines=10
width=36
horizontal-pad=24
vertical-pad=12
inner-pad=8
anchor=center
layer=overlay
match-mode=fzf

# Не показывать список, пока не начат ввод
hide-before-typing=no


[colors]
# Nord
background=2e3440f2
text=d8dee9ff
message=d8dee9ff
prompt=81a1c1ff
placeholder=616e88ff
input=eceff4ff
match=88c0d0ff
selection=81a1c1ff
selection-text=2e3440ff
selection-match=2e3440ff
counter=d8dee9ff
border=4c566aff


[border]
width=2
radius=10


[dmenu]
# В dmenu-режиме возвращать сам текст выбранной строки
mode=text
exit-immediately-if-empty=yes
