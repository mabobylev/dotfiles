surface1 = "#3b4261"
surface2 = "#414868"
accent   = "#7aa2f7"
teal     = "#73daca"
blue     = "#3d59a1"

[palettes.catppuccin]
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
accent   = "#89b4fa"
teal     = "#94e2d5"
blue     = "#74c7ec"

[palettes.gruvbox]
