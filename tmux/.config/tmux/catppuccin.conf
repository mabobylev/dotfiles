# vim:set ft=tmux:
############################################################
##           CUSTOM NORD TMUX THEME SETTINGS              ##
############################################################
# set BG=default to enable transparent
# --> Catppuccin (Mocha)
set -ogq @thm_bg "#1e1e2e"
set -ogq @thm_fg "#cdd6f4"

# Colors
set -ogq @thm_rosewater "#f5e0dc"
set -ogq @thm_flamingo "#f2cdcd"
set -ogq @thm_pink "#f5c2e7"
set -ogq @thm_mauve "#cba6f7"
set -ogq @thm_red "#f38ba8"
set -ogq @thm_maroon "#eba0ac"
set -ogq @thm_peach "#fab387"
set -ogq @thm_yellow "#f9e2af"
set -ogq @thm_green "#a6e3a1"
set -ogq @thm_teal "#94e2d5"
set -ogq @thm_sky "#89dceb"
set -ogq @thm_sapphire "#74c7ec"
set -ogq @thm_blue "#89b4fa"
set -ogq @thm_lavender "#b4befe"

# Surfaces and overlays
set -ogq @thm_subtext_1 "#a6adc8"
set -ogq @thm_subtext_0 "#bac2de"
set -ogq @thm_overlay_2 "#9399b2"
set -ogq @thm_overlay_1 "#7f849c"
set -ogq @thm_overlay_0 "#6c7086"
set -ogq @thm_surface_2 "#585b70"
set -ogq @thm_surface_1 "#45475a"
set -ogq @thm_surface_0 "#313244"
set -ogq @thm_mantle "#181825"
set -ogq @thm_crust "#11111b"

mycpu_icon=" "
myram_icon=" "
folder_icon=" "
cmd_icon=" "
system_icon="󰣇 "
window_icon=" "
active_icon="󰔟 "

HALF_ROUND_RIGHT=""
SEP_ROUND_RIGHT=""
HALF_ROUND_LEFT=""
SEP_ROUND_LEFT=""
TRIANGLE_LEFT=""
SEP_TRIANGLE_LEFT=""
TRIANGLE_RIGHT=""
SEP_TRIANGLE_RIGHT=""
HALF_SQUARE_RIGHT=""
SEP_SQUARE_RIGHT=""
HALF_SQUARE_LEFT="" 
SEP_SQUARE_LEFT=""

set -g status-style "bg=#{E:@thm_bg},fg=#{@thm_fg}"
set -g status-justify "centre"
set -g status-right-length 100
set -g status-left-length 100

set -g status-left "\
#[fg=#{@thm_yellow}]${HALF_ROUND_LEFT}\
#[bg=#{@thm_yellow},fg=#{@thm_bg}]#{window_icon} #S\
#[fg=#{@thm_yellow}]${SEP_ROUND_RIGHT}\
#[bg=#{@thm_teal}]${HALF_ROUND_RIGHT} \
#[bg=#{@thm_teal},fg=#{@thm_bg}]#{folder_icon} #{pane_current_path}\
#[fg=#{@thm_teal}]${SEP_ROUND_RIGHT}\
#[bg=#{@thm_mauve}]${HALF_ROUND_RIGHT} \
#[bg=#{@thm_mauve},fg=#{@thm_bg}]#{cmd_icon} #{pane_current_command}\
#[bg=default,fg=#{@thm_mauve}]${HALF_ROUND_RIGHT}"

set -g status-right "\
#[fg=#{@thm_blue},bg=default]${HALF_ROUND_LEFT}\
#[bg=#{@thm_blue},fg=#{@thm_bg}]#{active_icon}#{t/f/%%H#:%%M:window_activity} \
#[fg=#{@thm_mauve}]${HALF_ROUND_LEFT}\
#[bg=#{@thm_mauve},fg=#{@thm_bg}]${mycpu_icon}#{cpu_percentage} \
#[fg=#{@thm_teal}]${HALF_ROUND_LEFT}\
#[bg=#{@thm_teal},fg=#{@thm_bg}]${myram_icon}#{ram_percentage} \
#[fg=#{@thm_yellow}]${HALF_ROUND_LEFT}\
#[bg=#{@thm_yellow},fg=#{@thm_bg}]${system_icon}#h\
#[bg=#{@thm_bg},fg=#{@thm_yellow}]${HALF_ROUND_RIGHT}"

set -g window-status-format "\
#[fg=#{@thm_surface_0}]${HALF_ROUND_LEFT}\
#[fg=#{@thm_teal},bg=#{@thm_surface_0}]#I: \
#[fg=#{@thm_teal}]#W #F\
#[fg=#{@thm_surface_0},bg=default]${HALF_ROUND_RIGHT}"

set -g window-status-current-format "\
#[fg=#{@thm_rosewater}]${HALF_ROUND_LEFT}\
#[fg=#{@thm_bg},bg=#{@thm_rosewater}]#I: \
#[fg=#{@thm_bg}]#W #F\
#[fg=#{@thm_rosewater},bg=default]${HALF_ROUND_RIGHT}"
