# Пользовательская раскладка tmux-бара.
#
# Цвета берутся из сгенерированного Noctalia файла themes/noctalia.conf:
# @noctalia_primary, @noctalia_surface_container* и т.д. Здесь нет статической
# палитры, поэтому смена темы Noctalia меняет цвета без правки этого файла.

mycpu_icon=" "
myram_icon=" "
folder_icon=" "
cmd_icon=" "
system_icon="󰣇 "
window_icon=" "
active_icon="󰔟"

HALF_ROUND_RIGHT=""
SEP_ROUND_RIGHT=""
HALF_ROUND_LEFT=""
SEP_ROUND_LEFT=""
TRIANGLE_LEFT=""
SEP_TRIANGLE_LEFT=""
TRIANGLE_RIGHT=""
SEP_TRIANGLE_RIGHT=""
HALF_SQUARE_RIGHT=""
SEP_SQUARE_RIGHT=""
HALF_SQUARE_LEFT=""
SEP_SQUARE_LEFT=""

set -g status-justify "centre"
set -g status-right-length 100
set -g status-left-length 100

set -g status-left "\
#[fg=#{@noctalia_primary}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary}]${window_icon}\
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface}] #S \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT} \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface}] #{pane_current_path} \
#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary}] ${folder_icon}\
#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT} \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface}] #{pane_current_command} \
#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary}] ${cmd_icon}\
#[bg=#{@noctalia_surface_container_low},fg=#{@noctalia_primary}]${HALF_ROUND_RIGHT}"

set -g status-right "\
#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary}]${active_icon} \
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface}] #{t/f/%%H#:%%M:window_activity}\
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT} \
#[fg=#{@noctalia_secondary_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_secondary_container},fg=#{@noctalia_on_secondary_container}]${mycpu_icon}\
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_secondary_container}] #{cpu_percentage} \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT} \
#[fg=#{@noctalia_surface_container_high},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_surface_container_high},fg=#{@noctalia_primary}]${myram_icon} \
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface}] #{ram_percentage} \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT} \
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_LEFT}\
#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_tertiary_container}]${system_icon}\
#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary}] #h\
#[bg=#{@noctalia_surface_container_low},fg=#{@noctalia_primary}]${HALF_ROUND_RIGHT}"

set -g window-status-format "\
#[fg=#{@noctalia_surface_container_high}]${HALF_ROUND_LEFT}\
#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_high}]#I \
#[fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container}] #W #F\
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT}"

set -g window-status-current-format "\
#[fg=#{@noctalia_primary}]${HALF_ROUND_LEFT}\
#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary}]#I \
#[fg=#{@noctalia_on_tertiary_container},bg=#{@noctalia_surface_container}] #W #F\
#[fg=#{@noctalia_surface_container},bg=#{@noctalia_surface_container_low}]${HALF_ROUND_RIGHT}"
