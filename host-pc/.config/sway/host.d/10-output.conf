# =============================================================================
#  Домашний ПК — основной монитор
# =============================================================================
# При изменении выхода/разрешения: swaymsg -t get_outputs

output DP-2 resolution 1920x1080 position 0,0
# VRR/FreeSync: монитор сообщает поддержку. Если появится мерцание —
# заменить на `adaptive_sync off`.
output DP-2 adaptive_sync on
# Начинать сборку кадра за 3 мс до обновления (144 Гц ≈ 6.94 мс на кадр).
# При пропусках кадров увеличить; при стабильной работе можно снизить.
output DP-2 max_render_time 3
# Монитор не сообщает субпиксельную геометрию. Если текст в GTK-приложениях
# начнёт отдавать цветными каймами — убрать эту строку.
output DP-2 subpixel rgb
