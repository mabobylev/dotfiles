# host-pc: Codex-метр и полный набор плагинов рабочего ПК.

[bar.main]
start = ["workspaces", "umbriel_companion", "file_search", "notes", "taskbar"]
center = ["weather", "spacer_2", "clock", "spacer_2", "codex_meter"]
end = ["media", "control-center", "arch_updater", "udiskie", "keyboard_layout", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "sysmon", "tray", "session"]

[widget.launcher]
enabled = false

[widget.wallpaper]
enabled = false

[widget.codex_meter]
type = "salemsayed/codexbar-meter:bar"

# Массив enabled задаётся целиком: TOML не сливает списки, поэтому это полный
# набор плагинов ПК, а не дополнение к общему config.toml.
[plugins]
enabled = [
  "noctalia/umbriel-companion",
  "nightwatch75/file-search",
  "noctalia/notes",
  "dunarand/bookmarks",
  "aristides/udiskie",
  "yuuto/arch-updater",
  "weinguyen/procmon",
  "noctalia/screen_recorder",
  "gustav0ar/drive-health",
  "noctalia/translator",
  "weinguyen/shell-command",
  "thaer99ob/default-apps",
  "vn1k/cursor",
  "vn1k/icons",
  "liamwh/emoji-picker",
  "amancode22/global-menu",
  "salemsayed/codexbar-meter",
  "noctalia/wallhaven",
  "noctalia/timer",
]

[idle.behavior.lock]
timeout = 1800
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 3600
action = "screen_off"
enabled = true
