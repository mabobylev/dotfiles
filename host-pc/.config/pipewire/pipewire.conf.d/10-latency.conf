# Пониженная задержка для DAW и мониторинга.
#
# 256 сэмплов при 48 кГц ≈ 5.3 мс. Если появятся xrun'ы (треск, пропуски),
# поднять quantum до 512; если система стабильна — можно попробовать 128.
# Частота 48 кГц совпадает с большинством аудиоинтерфейсов и убирает
# ресемплинг при работе REAPER/Bitwig.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 256
    default.clock.min-quantum = 64
    default.clock.max-quantum = 1024
}
