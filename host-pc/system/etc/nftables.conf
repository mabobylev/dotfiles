#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:
#
# Хост-файрвол домашней рабочей станции (192.168.1.0/24, роутер 192.168.1.1).
#
# Закрывает входящие соединения из LAN и страхует от сервисов, случайно
# поднятых на 0.0.0.0. Внешний периметр (WAN -> LAN) закрывает OpenWrt;
# NAT роутера при этом не защищает от других устройств в локальной сети.
#
# Установка:
#   sudo install -Dm644 ~/.dotfiles/host-pc/system/etc/nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables
#
# Проверка:
#   sudo nft list ruleset
#   journalctl -k -g nft-drop -f        # что блокируется

destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state { established, related } accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"

    # DHCPv6-клиент: ответы роутера приходят юникастом на 546 и не всегда
    # попадают в conntrack, поэтому разрешаем порт явно.
    udp dport 546 accept comment "DHCPv6 client"

    # SSH на этот хост — только из локальной сети. Исходящие SSH-сессии
    # (например, на роутер) это правило не затрагивает.
    ip saddr 192.168.1.0/24 tcp dport 22 accept comment "sshd from LAN"

    # libvirt NAT: dnsmasq на хосте обслуживает гостей (DHCP, DNS, PXE).
    iifname "virbr*" udp dport { 53, 67, 69 } accept comment "libvirt dnsmasq: DNS/DHCP/TFTP"
    iifname "virbr*" tcp dport 53 accept comment "libvirt dnsmasq: DNS/TCP"

    # --- Сервисы в LAN (включать по мере надобности) ---
    # mDNS/Avahi: принтеры, Chromecast, обнаружение хостов
    # udp dport 5353 accept comment "mDNS"
    # KDE Connect
    # tcp dport 1716 accept comment "KDE Connect"
    # udp dport 1716 accept comment "KDE Connect"
    # Syncthing
    # tcp dport 22000 accept comment "Syncthing"
    # udp dport 22000 accept comment "Syncthing"

    # Диагностика: что именно блокируется. Частота ограничена, чтобы
    # сканирующее устройство не забило журнал.
    limit rate 10/minute burst 5 packets log prefix "nft-drop: " level info
    counter
  }

  chain forward {
    type filter hook forward priority filter; policy drop

    # libvirt: NAT и фильтрацию гостей настраивает сам. Здесь только не
    # мешаем — выпускаем трафик из виртуальных сетей и ответы обратно.
    # Новые входящие из LAN в ВМ остаются закрытыми; для проброса портов
    # добавьте отдельное правило.
    iifname "virbr*" accept comment "libvirt: guests -> anywhere"
    oifname "virbr*" ct state established,related accept comment "libvirt: replies to guests"
  }
}
