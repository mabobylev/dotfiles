# =============================================================================
#  Тачпад ноутбука
# =============================================================================

input "type:touchpad" {
    dwt enabled              # не реагировать на касания во время набора
    tap enabled              # клик касанием
    middle_emulation enabled # средняя кнопка — тремя пальцами
}

# На ноутбуке удобно иметь NumLock включённым при старте
input * xkb_numlock enabled
