# =============================================================================
#  Геометрия плавающих окон под экран 1366x768
# =============================================================================
# Общие правила рассчитаны на 1920x1080. Здесь переопределяем только то,
# что не помещается на ноутбучный экран.

# Telegram: 400x850 на 768 px не влезает по высоте; прижимаем к правому краю
for_window [app_id="org.telegram.desktop"] resize set 380px 720px, move left 980px, move up 0px
