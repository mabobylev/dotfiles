# host-laptop: компактный бар под 1366x768.
# Codex-метра на ноутбуке нет, тяжёлые виджеты убраны.
# Состав синхронизирован с текущим состоянием (noctalia config export).

[bar.main]
start = ["launcher", "keyboard_layout", "workspaces", "control-center", "umbriel_companion", "notes", "global_menu"]
center = ["clock"]
end = ["media", "notifications", "clipboard", "volume", "brightness", "battery", "sysmon", "weather", "bluetooth", "network", "tray", "session"]

[idle.behavior.lock]
timeout = 1800
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 3600
action = "screen_off"
enabled = true
