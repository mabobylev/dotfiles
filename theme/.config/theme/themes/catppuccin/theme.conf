# Тема «catppuccin» — Catppuccin Mocha.
# Ключи читает ~/.local/bin/theme-apply; цвета задаются без «#».

# --- GTK, иконки, курсор, шрифт ---
GTK_THEME=Adwaita
ICON_THEME=Papirus-Dark
CURSOR_THEME=Nordzy-cursors
CURSOR_SIZE=24
FONT=Ubuntu Nerd Font Condensed 10
COLOR_SCHEME=prefer-dark
ACCENT=blue
PREFER_DARK=1

# --- палитра Waybar / SwayNC / рамок Sway / fuzzel ---
BG=1e1e2e
FG=cdd6f4
GR=6c7086
BG2=313244
HOVER=45475a
BLUE=89b4fa
WARNING=f9e2af
CRITICAL=f38ba8

# --- терминал foot: набор из /usr/share/foot/themes ---
FOOT_THEME=catppuccin-mocha

# --- Neovim и starship ---
NVIM_COLORSCHEME=catppuccin-mocha
NVIM_BACKGROUND=dark
STARSHIP_PALETTE=catppuccin
