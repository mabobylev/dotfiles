# Тема «gruvbox» — Gruvbox Dark.
# Ключи читает ~/.local/bin/theme-apply; цвета задаются без «#».

# --- GTK, иконки, курсор, шрифт ---
GTK_THEME=Adwaita
ICON_THEME=Papirus-Dark
CURSOR_THEME=Nordzy-cursors
CURSOR_SIZE=24
FONT=Ubuntu Nerd Font Condensed 10
COLOR_SCHEME=prefer-dark
ACCENT=blue
PREFER_DARK=1

# --- палитра Waybar / SwayNC / рамок Sway / fuzzel ---
BG=282828
FG=ebdbb2
GR=928374
BG2=3c3836
HOVER=504945
BLUE=83a598
WARNING=fabd2f
CRITICAL=fb4934

# --- терминал foot: набор из /usr/share/foot/themes ---
FOOT_THEME=gruvbox-dark

# --- Neovim и starship ---
NVIM_COLORSCHEME=gruvbox
NVIM_BACKGROUND=dark
STARSHIP_PALETTE=gruvbox
ALPHA=0.8

# обои темы (файл в ~/.local/backgrounds/wallpapers)
WALLPAPERS="forest-7471935_1920.jpg river-7548838.jpg mountains-7500136.jpg"
