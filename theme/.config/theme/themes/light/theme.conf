# Тема «light» — светлое оформление.
# Ключи читает ~/.local/bin/theme-apply; цвета задаются без «#».

# --- GTK, иконки, курсор, шрифт ---
GTK_THEME=Adwaita
ICON_THEME=Papirus
CURSOR_THEME=Nordzy-cursors-white
CURSOR_SIZE=24
FONT=Ubuntu Nerd Font Condensed 10
COLOR_SCHEME=default
ACCENT=blue
PREFER_DARK=0

# --- палитра Waybar / SwayNC / рамок Sway / fuzzel ---
BG=f2f3f5
FG=2e3440
GR=9aa3b2
BG2=e4e7ec
HOVER=d6dae1
BLUE=3b7fb5
WARNING=b07d00
CRITICAL=c0392b

# --- терминал foot: набор из /usr/share/foot/themes ---
FOOT_THEME=solarized-light

# --- Neovim и starship ---
NVIM_COLORSCHEME=tokyonight-day
NVIM_BACKGROUND=light
STARSHIP_PALETTE=light
ALPHA=0.8

# обои темы (файл в ~/.local/backgrounds/wallpapers)
WALLPAPER=mountains-7558365_1920.jpg
